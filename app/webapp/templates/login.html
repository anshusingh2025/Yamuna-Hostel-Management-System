
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Hostel Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        /* ===== BODY ===== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #e8f7f0, #f5fbf8);
            min-height: 100vh;
        }


        /* ===== NAVBAR ===== */

        .navbar-custom {
            background: linear-gradient(90deg, #087f5b, #12a87a);
            padding: 13px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        .navbar-brand {
            font-weight: 700;
        }

        .nav-link {
            color: white !important;
            margin-left: 8px;
            border-radius: 7px;
            padding: 8px 13px !important;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255,255,255,0.18);
        }


        /* ===== LOGIN SECTION ===== */

        .login-section {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }


        /* ===== LOGIN CARD ===== */

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 38px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,80,60,0.14);
            border: 1px solid #dcefe7;
        }


        /* ===== ICON ===== */

        .login-icon {
            width: 75px;
            height: 75px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #087f5b, #20c997);
            color: white;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(8,127,91,0.25);
        }


        /* ===== HEADING ===== */

        .login-card h2 {
            color: #087f5b;
            font-weight: 700;
            margin-top: 15px;
        }

        .login-card .subtitle {
            color: #7a869a;
            font-size: 14px;
            margin-bottom: 28px;
        }


        /* ===== FORM ===== */

        .form-label {
            font-weight: 600;
            color: #344054;
        }

        .input-group-text {
            background: #eefaf5;
            color: #087f5b;
            border: 1px solid #d5e4de;
        }

        .form-control {
            height: 46px;
            border: 1px solid #d5e4de;
        }

        .form-control:focus {
            border-color: #12a87a;
            box-shadow: 0 0 0 0.2rem rgba(18,168,122,0.15);
        }


        /* ===== PASSWORD BUTTON ===== */

        .show-password {
            border: 1px solid #d5e4de;
            background: #eefaf5;
            color: #087f5b;
        }


        /* ===== FORGOT ===== */

        .forgot {
            color: #087f5b;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* ===== LOGIN BUTTON ===== */

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #087f5b, #12a87a);
            color: white;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(8,127,91,0.25);
        }


        /* ===== REGISTER ===== */

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #667085;
            font-size: 14px;
        }

        .register-link a {
            color: #087f5b;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }


        /* ===== RESPONSIVE ===== */

        @media (max-width: 500px) {

            .login-card {
                padding: 28px 20px;
            }

            .login-card h2 {
                font-size: 25px;
            }
        }

    </style>
</head>

<body>




<!-- ================= LOGIN ================= -->

<section class="login-section">

    <div class="login-card">

        <div class="text-center">

            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>

            <h2>Welcome Back!</h2>

            <p class="subtitle">
                Login to your Hostel Management account
            </p>

        </div>

<form id="loginForm" method="POST" action="{% url 'login' %}">
        
    {% csrf_token %}

            <!-- Username -->

            <div class="mb-3">

                <label class="form-label">
                    Username or Email
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           placeholder="Enter username or email"
                           required>

                </div>

            </div>


            <!-- Password -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input type="password"
                            id="password"
                           name="password"
                           class="form-control"
                           placeholder=" Enter password"
                           required>

                    <button type="button"
                            class="btn show-password"
                            onclick="togglePassword()">

                        <i class="bi bi-eye" id="eyeIcon"></i>

                    </button>

                </div>

            </div>


            <!-- Remember + Forgot -->

            <div class="d-flex justify-content-between align-items-center">

                <div class="form-check">

                    <input class="form-check-input"
                           type="checkbox"
                           id="remember">

                    <label class="form-check-label"
                           for="remember">

                        Remember me

                    </label>

                </div>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>


            <!-- Login Button -->

            <button type="submit" class="login-btn">

                <i class="bi bi-box-arrow-in-right"></i>
                Login

            </button>

        </form>


        <!-- Registration -->

        <div class="register-link">

            Don't have an account?

            <a href="{% url 'register' %}">
        Register Now
    </a>

        </div>

    </div>

</section>


<!-- ================= JAVASCRIPT ================= -->




<script>





    // Show / Hide Password

    function togglePassword() {

        const password =
            document.getElementById("password");

        const eyeIcon =
            document.getElementById("eyeIcon");

        if (password.type === "password") {

            password.type = "text";

            eyeIcon.classList.remove("bi-eye");
            eyeIcon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            eyeIcon.classList.remove("bi-eye-slash");
            eyeIcon.classList.add("bi-eye");

        }
    }


   

</script>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
